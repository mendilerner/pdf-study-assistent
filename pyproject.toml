[project]
name = "pdf-study-assistant"
version = "0.1.0"
description = "Academic PDF study assistant — upload Hebrew textbook PDFs, search semantically, ask AI questions."
requires-python = ">=3.13"
dependencies = [
    "elasticsearch>=8.0,<9",
    "marker-pdf",
    "pymupdf",
    "sentence-transformers>=6.0.0",
    "sentencepiece>=0.2.2",
    "transformers>=5.15.0",
]

[tool.uv]
package = false
